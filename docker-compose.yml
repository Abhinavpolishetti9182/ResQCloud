services:
  resqcloud-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: resqcloud-backend

    ports:
      - "5000:5000"

    volumes:
      - resqcloud_data:/app/data

    environment:
      PYTHONUNBUFFERED: "1"

    restart: unless-stopped


volumes:
  resqcloud_data: